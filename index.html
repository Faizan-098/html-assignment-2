<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <h1>Application Form</h1>

        <label for="name">Name: </label>
        <input type="text" id="name" required>

        <label for="lastname">Last Name: </label>
        <input type="text" id="lastname" required><br><br>

        <label for="date of birth">Date of birth: </label>
        <input type="date" id="date of birth" required>

        <label for="Age">Age: </label>
        <input type="number" value="77" id="Age" required><br><br>

        <label for="Gender">Gender:</label>
        <select id="Gender" name="Gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter email address" required> <br><br>

        <label >Positions Available: </label>

        <input type="radio" name="position" id="junior" required>
        <label for="junior">Junior Developer</label>

        <input type="radio" name="position" id="mid-level" required>
        <label for="mid-level">Mid-level Developer</label> 

        <input type="radio" name="position" id="senior" required>
        <label for="senior">Senior Developer</label> <br><br>

        <label for="">Programming languages:</label>

        <input type="checkbox" id="java" >
        <label for="java">Java</label>

        <input type="checkbox" id="javascript" >
        <label for="javascript">Javascript</label>

        <input type="checkbox" id="python" required>
        <label for="python">Python</label><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" required>

        <label for="Confirm">Confirm password:</label>
        <input type="password" id="Confirm" required><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
</body>

</html>
